name: Update RSS Feed

on:
  schedule:
   - cron: '0 0 * * *'    # 每天運行一次：一般 RSS 掃描 + 新文章處理
   - cron: '0 3 * * 0'    # 每週日額外運行一次：backfill_metadata 補齊模式
  workflow_dispatch:  # 允許手動觸發
    inputs:
      max_new_entries:
        description: '測試模式：本次最多處理幾篇新文章（留空 = 不限制，正式全量執行）'
        required: false
        default: ''
      reprocess_pmids:
        description: '重新處理模式：填入既有文章的 pmid，逗號分隔可一次多篇（設定後會忽略 max_new_entries，只重跑這幾篇）'
        required: false
        default: ''
      backfill_metadata:
        description: '補齊模式：設為 true 只幫舊文章補上缺少的 publication_types / pmc_id（不呼叫 OpenAI，不做一般 RSS 掃描）'
        required: false
        default: ''

jobs:
  update-rss:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4  # 更新到 v4

    - name: Set up Python
      uses: actions/setup-python@v5  # 更新到 v5
      with:
        python-version: '3.9'  # 指定 Python 版本

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run RSS processor
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        MAX_NEW_ENTRIES: ${{ github.event.inputs.max_new_entries }}
        REPROCESS_PMIDS: ${{ github.event.inputs.reprocess_pmids }}
        # 手動觸發時看 workflow_dispatch 的輸入；排程觸發時，週日凌晨那個 cron
        # （'0 3 * * 0'）自動視為補齊模式，其餘每天的排程照常跑一般 RSS 掃描
        BACKFILL_METADATA: ${{ github.event.inputs.backfill_metadata || (github.event.schedule == '0 3 * * 0' && 'true' || '') }}
      run: python rss_processor.py

    - name: Handle script failure
      if: failure()
      run: |
        echo "RSS processing script failed. Check the logs for more information."
        # 可以在這裡添加更多的錯誮處理邏輯,例如發送通知

    - name: Update last run time
      if: success()
      run: |
        echo "Last successful run: $(date)" > last_run.txt
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add last_run.txt
        git commit -m "Update last run time" || echo "No changes to commit"
        git push
